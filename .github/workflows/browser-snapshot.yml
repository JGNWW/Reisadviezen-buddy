name: Browser-snapshots (DK/NO/CH)

# Bronnen die serverside niet op te halen zijn (um.dk = React-SPA met
# vergrendelde API; regjeringen.no = Cloudflare-botcheck; eda.admin.ch =
# datacenter-blokkade) worden hier met een echte headless Chromium gerenderd
# en als vangnet naar worker/data/latest/ geschreven — de Worker serveert die
# snapshots wanneer live ophalen faalt of niets oplevert.
#
# 's Nachts + handmatig met een optionele landenlijst voor gerichte verversing.
#
# Er staan bewust twee cronregels (00:00 en 01:00 UTC). Eerder koos een
# guard-job er één van, zodat het precies 02:00 Amsterdam bleef ongeacht
# zomer-/wintertijd. Dat werkte niet: GitHub start geplande runs uren te laat
# én de concurrency-group annuleert er dan één van — in de praktijk juist
# degene die de guard wilde hebben, waardoor de capture nooit draaide (0
# Noorse snapshots over 226 landen, weken achtereen).
#
# Daarom nu geen guard meer: beide runs gaan door. De concurrency-group
# serialiseert ze en een tweede capture op dezelfde dag is onschadelijk — hij
# schrijft alleen als de inhoud verandert. Liever twee keer draaien dan nul
# keer.
on:
  schedule:
    - cron: '0 0 * * *' # 02:00 Amsterdam tijdens zomertijd (CEST = UTC+2)
    - cron: '0 1 * * *' # 02:00 Amsterdam tijdens wintertijd (CET  = UTC+1)
  workflow_dispatch:
    inputs:
      countries:
        description: 'Alleen deze ISO3-codes (komma-gescheiden), leeg = alle'
        required: false
        default: ''
  # Bij wijziging van script/workflow zelf: een beperkte proefrun (Golfstaten)
  # zodat elke aanpassing meteen end-to-end gevalideerd is.
  push:
    branches: [main]
    paths:
      - '.github/workflows/browser-snapshot.yml'
      - 'worker/scripts/browser-snapshot.mjs'

permissions:
  contents: write

concurrency:
  group: browser-snapshot
  cancel-in-progress: false

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: worker/package-lock.json

      - name: Dependencies installeren
        run: npm ci

      # --no-save: playwright alleen in déze job — de andere workflows
      # (tests, 6-uurs-snapshot) blijven licht en ongewijzigd.
      - name: Playwright Chromium installeren
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium

      - name: Browser-snapshots maken
        run: node scripts/browser-snapshot.mjs
        env:
          # dispatch: gekozen lijst · push (proefrun): Golfstaten · cron: alles
          COUNTRIES: ${{ github.event_name == 'push' && 'BHR,IRQ,JOR,KWT,OMN,QAT,SAU,ARE' || inputs.countries }}

      - name: Wijzigingen committen
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/latest
          if ! git diff --cached --quiet; then
            git commit -m "Browser-snapshots DK/NO/CH $(date -u +%Y-%m-%dT%H:%M)"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
